enabled: false
image:
  repository: ghcr.io/perkforge/perkforge-portal
  digest: ''
# Names only: credentials are provisioned externally in the release namespace.
imagePullSecrets: []
nodeSelector: {}
affinity: {}
portalOrigin: ''
identity:
  caConfigMap: ""
  hostAliases: []
  issuer: ''
  clientId: ''
  audience: ''
  existingSecret: ''
# This release intentionally supports disabled GitLab only.
tenantSource: disabled
accessPolicy: home
# This chart references an existing account; it never creates RBAC or service accounts.
serviceAccount:
  name: ''

# Generated from reviewed immutable enrollment source; disabled until image and
# cross-repository source evidence are promoted together. No runtime API access.
enrollmentInventory:
  enabled: false
  sourceCommit: ''
  selector: ''
  sha256: ''
  content: ''
