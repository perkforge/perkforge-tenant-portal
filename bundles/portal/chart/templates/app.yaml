{{- if .Values.enabled }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "An approved immutable image digest is required" }}
{{- end }}
{{- if not (regexMatch "^https://[a-zA-Z0-9.-]+(:[0-9]+)?$" .Values.portalOrigin) }}
{{- fail "An approved HTTPS portal origin is required" }}
{{- end }}
{{- if ne .Values.tenantSource "disabled" }}
{{- fail "GitLab must remain disabled in this release" }}
{{- end }}
{{- if not (has .Values.accessPolicy (list "home" "platform-admins")) }}
{{- fail "A supported explicit accessPolicy is required" }}
{{- end }}
{{- if not (hasPrefix "https://" .Values.identity.issuer) }}
{{- fail "A reviewed HTTPS identity issuer is required" }}
{{- end }}
{{- if .Values.enrollmentInventory.enabled }}
{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.enrollmentInventory.sourceCommit) }}
{{- fail "Inventory requires immutable sourceCommit" }}
{{- end }}
{{- if not (has .Values.enrollmentInventory.selector (list "local" "dev" "local-nextcloud" "local-nextcloud-portal")) }}
{{- fail "Inventory requires explicit supported selector" }}
{{- end }}
{{- if or (gt (len .Values.enrollmentInventory.content) 131072) (ne (sha256sum .Values.enrollmentInventory.content) .Values.enrollmentInventory.sha256) }}
{{- fail "Inventory content must match reviewed SHA256 and size limit" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app.kubernetes.io/name: perkforge-portal
spec:
  replicas: 1
  # Process-local sessions preclude overlapping replicas during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: perkforge-portal
  template:
    metadata:
      labels: *labels
      {{- if .Values.enrollmentInventory.enabled }}
      annotations:
        checksum/enrollment-inventory: {{ .Values.enrollmentInventory.sha256 | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ required "serviceAccount.name must reference an approved existing account" .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.identity.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.identity.caConfigMap .Values.enrollmentInventory.enabled }}
      volumes:
      {{- if .Values.enrollmentInventory.enabled }}
      - name: enrollment-inventory
        configMap:
          name: {{ .Release.Name }}-enrollment-inventory
      {{- end }}
      {{- if .Values.identity.caConfigMap }}
      - name: identity-ca
        configMap:
          name: {{ .Values.identity.caConfigMap | quote }}
          items:
          - key: ca.crt
            path: ca.crt
      {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: portal
        image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: http
          containerPort: 3000
        {{- if or .Values.identity.caConfigMap .Values.enrollmentInventory.enabled }}
        volumeMounts:
        {{- if .Values.enrollmentInventory.enabled }}
        - name: enrollment-inventory
          mountPath: /etc/portal/enrollment
          readOnly: true
        {{- end }}
        {{- if .Values.identity.caConfigMap }}
        - name: identity-ca
          mountPath: /etc/portal/identity-ca
          readOnly: true
        {{- end }}
        {{- end }}
        env:
        {{- if .Values.enrollmentInventory.enabled }}
        - name: ENROLLMENT_SOURCE
          value: gitops-configmap
        - name: ENROLLMENT_SOURCE_COMMIT
          value: {{ .Values.enrollmentInventory.sourceCommit | quote }}
        - name: ENROLLMENT_SELECTOR
          value: {{ .Values.enrollmentInventory.selector | quote }}
        - name: ENROLLMENT_INVENTORY_SHA256
          value: {{ .Values.enrollmentInventory.sha256 | quote }}
        {{- end }}
        {{- if .Values.identity.caConfigMap }}
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/portal/identity-ca/ca.crt
        {{- end }}
        - name: LISTEN_HOST
          value: '0.0.0.0'
        - name: PORTAL_ORIGIN
          value: {{ .Values.portalOrigin | quote }}
        - name: TENANT_SOURCE
          value: disabled
        - name: PORTAL_ACCESS_POLICY
          value: {{ .Values.accessPolicy | quote }}
        - name: OIDC_ISSUER
          value: {{ .Values.identity.issuer | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ required "identity.clientId required" .Values.identity.clientId | quote }}
        - name: OIDC_AUDIENCE
          value: {{ required "identity.audience required" .Values.identity.audience | quote }}
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ required "operator-managed identity.existingSecret required" .Values.identity.existingSecret | quote }}
              key: client-secret
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: perkforge-portal
  ports:
  - name: http
    port: 3000
    targetPort: http
{{- end }}

{{- if and .Values.enabled .Values.enrollmentInventory.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-enrollment-inventory
  namespace: {{ .Release.Namespace }}
data:
  enrollment-inventory.json: {{ .Values.enrollmentInventory.content | quote }}
{{- end }}
