# Tenant-owned app release. Platform enrollment supplies the namespace and source.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portal
spec:
  suspend: true
  interval: 10m
  releaseName: portal
  serviceAccountName: portal-deployer
  storageNamespace: tenant-example-portal-release
  chart:
    spec:
      chart: ./bundles/portal/chart # household-portal 0.1.1, in this same repository.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: tenant-portal # Platform-owned source in the release namespace.
  valuesFrom:
  - kind: ConfigMap
    name: portal-defaults
    valuesKey: values.yaml
  - kind: ConfigMap
    name: portal-environment
    valuesKey: values.yaml
  - kind: ConfigMap
    name: portal-profile
    valuesKey: values.yaml
  - kind: ConfigMap
    name: portal-cluster
    valuesKey: values.yaml
