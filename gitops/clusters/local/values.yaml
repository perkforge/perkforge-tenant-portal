# Physical activation candidate; enrollment remains independently pinned and suspended.
enabled: true
# Routing/TLS is platform-owned; this chart creates no ingress.
portalOrigin: https://portal.perkforge.home.arpa
# v0.5.0, verified source/version digest from the successful image publisher.
image:
  digest: sha256:eaa66ab13be20079f188f4b5d8c5d79e274612f0f5742a8d3c0d2f0f6a48560d
identity:
  issuer: https://keycloak.perkforge.home.arpa/auth/realms/perkforge
  clientId: portal-local
  audience: portal-local
  caConfigMap: portal-identity-ca
  hostAliases: []
accessPolicy: platform-admins
# GHCR remains private. The existing shared portal-registry-existing reference
# needs separately approved credential delivery; no credential is supplied here.
nodeSelector: {storage.perkforge.io/worker: "true"}
# Require workers and exclude control-plane nodes even if labels/taints change.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
        - key: node-role.kubernetes.io/master
          operator: DoesNotExist
