apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shared
- ../../environments/local
- ../../profiles/il2
configMapGenerator:
- name: portal-cluster
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  example.perkforge.io/cluster: local
  example.perkforge.io/environment: local
  example.perkforge.io/profile: il2
patches:
- target: {kind: HelmRelease, name: portal}
  patch: |-
    - op: add
      path: /spec/targetNamespace
      value: tenant-portal
    - op: replace
      path: /spec/storageNamespace
      value: tenant-portal-release
- target: {kind: HelmRelease, name: portal}
  patch: |-
    - op: replace
      path: /spec/suspend
      value: false
