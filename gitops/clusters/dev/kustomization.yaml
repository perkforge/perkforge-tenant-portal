apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../shared
- ../../environments/dev
- ../../profiles/il2
configMapGenerator:
- name: portal-cluster
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  platform.perkforge.io/cluster: dev
  platform.perkforge.io/environment: dev
  platform.perkforge.io/profile: il2
